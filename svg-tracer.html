<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Draw to SVG</title>
<style>
  :root{
    --paper:#F7F8F6;
    --ink:#16262B;
    --grid:#DCE5E3;
    --grid-strong:#C6D3D0;
    --rule:#C9D4D1;
    --teal:#1F6F6B;
    --panel:#101A1D;
    --panel-ink:#CBD8D5;
    --panel-dim:#6E8480;
    --amber:#C98A2E;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    font-family:"Inter","Helvetica Neue",Arial,sans-serif;
    color:var(--ink);
    background:var(--paper);
    display:flex;flex-direction:column;
    overflow:hidden;
  }

  header{
    display:flex;align-items:baseline;gap:16px;
    padding:14px 20px 12px;
    border-bottom:1px solid var(--rule);
    flex:0 0 auto;
  }
  header h1{
    font-size:17px;font-weight:600;margin:0;letter-spacing:-.01em;
  }
  header p{margin:0;font-size:13px;color:#5C6E6B}

  main{flex:1 1 auto;display:flex;min-height:0}

  /* ---------- left: drawing ---------- */
  .stage{
    flex:1 1 58%;min-width:0;
    display:flex;flex-direction:column;
    border-right:1px solid var(--rule);
  }
  .toolbar{
    display:flex;flex-wrap:wrap;align-items:center;gap:6px;
    padding:10px 14px;border-bottom:1px solid var(--rule);
    flex:0 0 auto;
  }
  .group{display:flex;align-items:center;gap:4px}
  .sep{width:1px;height:22px;background:var(--rule);margin:0 6px}

  button{
    font:inherit;font-size:13px;
    padding:6px 11px;border:1px solid var(--rule);
    background:#fff;color:var(--ink);border-radius:3px;cursor:pointer;
  }
  button:hover{border-color:#9FB2AE}
  button:focus-visible,input:focus-visible,select:focus-visible{
    outline:2px solid var(--teal);outline-offset:1px
  }
  button[aria-pressed="true"]{
    background:var(--teal);border-color:var(--teal);color:#fff;
  }

  label.field{display:flex;align-items:center;gap:6px;font-size:12.5px;color:#485956}
  input[type=range]{width:92px;accent-color:var(--teal)}
  input[type=color]{
    width:30px;height:26px;padding:0;border:1px solid var(--rule);
    border-radius:3px;background:#fff;cursor:pointer;
  }
  .num{font-variant-numeric:tabular-nums;min-width:30px;text-align:right;color:#6B7C79}

  .canvas-wrap{
    flex:1 1 auto;min-height:0;position:relative;
    background:
      linear-gradient(var(--grid) 1px,transparent 1px) 0 0/20px 20px,
      linear-gradient(90deg,var(--grid) 1px,transparent 1px) 0 0/20px 20px,
      linear-gradient(var(--grid-strong) 1px,transparent 1px) 0 0/100px 100px,
      linear-gradient(90deg,var(--grid-strong) 1px,transparent 1px) 0 0/100px 100px,
      #fff;
    display:flex;
  }
  #board{flex:1 1 auto;touch-action:none;cursor:crosshair;display:block}
  .hint{
    position:absolute;inset:auto 0 18px 0;text-align:center;
    font-size:13px;color:#8B9B98;pointer-events:none;
  }

  /* ---------- right: code ---------- */
  .code{
    flex:1 1 42%;min-width:0;
    display:flex;flex-direction:column;background:var(--panel);
  }
  .code-bar{
    display:flex;align-items:center;gap:8px;
    padding:10px 14px;border-bottom:1px solid #22333A;flex:0 0 auto;
  }
  .code-bar h2{
    margin:0;font-size:13px;font-weight:600;color:var(--panel-ink);
    letter-spacing:.01em;flex:1 1 auto;
  }
  .code-bar .meta{font-size:12px;color:var(--panel-dim);font-variant-numeric:tabular-nums}
  .code-bar button{
    background:transparent;border-color:#2C4048;color:var(--panel-ink);
  }
  .code-bar button:hover{border-color:#456068;background:#17242A}

  pre{
    margin:0;flex:1 1 auto;overflow:auto;
    padding:16px 18px 40px;
    font-family:"SF Mono",Menlo,Consolas,monospace;
    font-size:12.5px;line-height:1.65;
    color:var(--panel-ink);white-space:pre;tab-size:2;
  }
  pre .t{color:#7FD1C6}
  pre .a{color:var(--amber)}
  pre .v{color:#E4EDEA}
  pre .c{color:#5E7570;font-style:italic}
  pre .empty{color:var(--panel-dim);font-style:italic}

  @media (max-width:860px){
    main{flex-direction:column}
    .stage{border-right:none;border-bottom:1px solid var(--rule);flex:1 1 55%}
    .code{flex:1 1 45%}
  }
</style>
</head>
<body>

<header>
  <h1>Draw to SVG</h1>
  <p>Sketch on the grid. The markup on the right is the drawing.</p>
</header>

<main>
  <section class="stage">
    <div class="toolbar">
      <div class="group" id="tools">
        <button data-tool="pen" aria-pressed="true">Freehand</button>
        <button data-tool="line" aria-pressed="false">Line</button>
        <button data-tool="rect" aria-pressed="false">Rectangle</button>
        <button data-tool="ellipse" aria-pressed="false">Ellipse</button>
        <button data-tool="erase" aria-pressed="false">Erase</button>
      </div>

      <span class="sep"></span>

      <label class="field">Stroke
        <input type="color" id="stroke" value="#16262B">
      </label>
      <label class="field">Fill
        <input type="color" id="fill" value="#1F6F6B" disabled>
        <input type="checkbox" id="fillOn">
      </label>
      <label class="field">Width
        <input type="range" id="width" min="1" max="24" step="1" value="3">
        <span class="num" id="widthVal">3</span>
      </label>

      <span class="sep"></span>

      <label class="field" title="Higher values drop more points, giving shorter paths">Simplify
        <input type="range" id="tol" min="0" max="12" step="0.5" value="2.5">
        <span class="num" id="tolVal">2.5</span>
      </label>
      <button id="smooth" aria-pressed="true" title="Fit curves through the points instead of straight segments">Smooth curves</button>

      <span class="sep"></span>

      <button id="undo">Undo</button>
      <button id="clear">Clear</button>
      <button id="import">Import SVG</button>
      <input type="file" id="file" accept=".svg,image/svg+xml" hidden>
    </div>

    <div class="canvas-wrap">
      <svg id="board" viewBox="0 0 1000 750" preserveAspectRatio="xMidYMid meet"
           xmlns="http://www.w3.org/2000/svg"></svg>
      <div class="hint" id="hint">Drag to draw &middot; Cmd/Ctrl+Z to undo</div>
    </div>
  </section>

  <section class="code">
    <div class="code-bar">
      <h2>svg</h2>
      <span class="meta" id="meta">0 shapes</span>
      <button id="copy">Copy</button>
      <button id="link">Copy link</button>
      <button id="download">Download</button>
    </div>
    <pre id="out"><span class="empty">Nothing drawn yet.</span></pre>
  </section>
</main>

<script>
(function(){
  "use strict";

  const VB_W = 1000, VB_H = 750;
  const board = document.getElementById('board');
  const out   = document.getElementById('out');
  const meta  = document.getElementById('meta');
  const hint  = document.getElementById('hint');

  let shapes = [];          // committed shapes
  let draft  = null;        // shape being drawn
  let pts    = [];          // raw points for freehand
  let drawing = false;

  const state = {
    tool:'pen',
    stroke:'#16262B',
    fill:null,
    width:3,
    tol:2.5,
    smooth:true
  };

  /* ---------- geometry helpers ---------- */

  const r = n => Math.round(n * 10) / 10;

  // Ramer–Douglas–Peucker
  function simplify(points, tol){
    if(points.length < 3 || tol <= 0) return points.slice();
    const keep = new Array(points.length).fill(false);
    keep[0] = keep[points.length-1] = true;
    const stack = [[0, points.length-1]];
    while(stack.length){
      const [s,e] = stack.pop();
      let maxD = -1, idx = -1;
      const a = points[s], b = points[e];
      const dx = b.x-a.x, dy = b.y-a.y;
      const len = Math.hypot(dx,dy);
      for(let i=s+1;i<e;i++){
        const p = points[i];
        let d;
        if(len === 0){ d = Math.hypot(p.x-a.x, p.y-a.y); }
        else { d = Math.abs(dy*p.x - dx*p.y + b.x*a.y - b.y*a.x) / len; }
        if(d > maxD){ maxD = d; idx = i; }
      }
      if(maxD > tol && idx > -1){
        keep[idx] = true;
        stack.push([s,idx],[idx,e]);
      }
    }
    return points.filter((_,i)=>keep[i]);
  }

  // Catmull-Rom -> cubic bezier path
  function smoothPath(p){
    if(p.length < 3) return polyPath(p);
    let d = `M ${r(p[0].x)} ${r(p[0].y)}`;
    for(let i=0;i<p.length-1;i++){
      const p0 = p[i-1] || p[i];
      const p1 = p[i], p2 = p[i+1];
      const p3 = p[i+2] || p2;
      const c1x = p1.x + (p2.x-p0.x)/6, c1y = p1.y + (p2.y-p0.y)/6;
      const c2x = p2.x - (p3.x-p1.x)/6, c2y = p2.y - (p3.y-p1.y)/6;
      d += ` C ${r(c1x)} ${r(c1y)}, ${r(c2x)} ${r(c2y)}, ${r(p2.x)} ${r(p2.y)}`;
    }
    return d;
  }

  function polyPath(p){
    if(!p.length) return '';
    return 'M ' + p.map((q,i)=> (i?'L ':'') + r(q.x) + ' ' + r(q.y)).join(' ');
  }

  function isClosed(p){
    if(p.length < 8) return false;
    const a = p[0], b = p[p.length-1];
    return Math.hypot(a.x-b.x, a.y-b.y) < 18;
  }

  /* ---------- shape -> markup ---------- */

  function attrs(s){
    const a = [];
    if(s.type === 'path')    a.push(['d', s.d]);
    if(s.type === 'line')    a.push(['x1',r(s.x1)],['y1',r(s.y1)],['x2',r(s.x2)],['y2',r(s.y2)]);
    if(s.type === 'rect')    a.push(['x',r(s.x)],['y',r(s.y)],['width',r(s.w)],['height',r(s.h)]);
    if(s.type === 'ellipse') a.push(['cx',r(s.cx)],['cy',r(s.cy)],['rx',r(s.rx)],['ry',r(s.ry)]);
    a.push(['fill', s.fill || 'none']);
    a.push(['stroke', s.stroke]);
    a.push(['stroke-width', s.width]);
    if(s.type === 'path' || s.type === 'line'){
      a.push(['stroke-linecap','round'],['stroke-linejoin','round']);
    }
    return a;
  }

  function tag(s){
    return `<${s.type} ` + attrs(s).map(([k,v])=>`${k}="${v}"`).join(' ') + '/>';
  }

  function esc(t){
    return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function tagHighlighted(s){
    const body = attrs(s)
      .map(([k,v])=>`<span class="a">${k}</span>=<span class="v">"${esc(v)}"</span>`)
      .join(' ');
    return `<span class="t">&lt;${s.type}</span> ${body}<span class="t">/&gt;</span>`;
  }

  function document_svg(){
    const open = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${VB_W} ${VB_H}">`;
    const body = shapes.map(s => '  ' + tag(s)).join('\n');
    return open + (body ? '\n' + body : '') + '\n</svg>';
  }

  /* ---------- render ---------- */

  const NS = 'http://www.w3.org/2000/svg';

  function render(){
    while(board.firstChild) board.removeChild(board.firstChild);
    const all = draft ? shapes.concat([draft]) : shapes;
    all.forEach((s,i)=>{
      const el = document.createElementNS(NS, s.type);
      attrs(s).forEach(([k,v]) => el.setAttribute(k,v));
      if(state.tool === 'erase' && i < shapes.length){
        el.style.cursor = 'pointer';
        el.dataset.index = i;
        if(!s.fill) el.setAttribute('pointer-events','stroke');
      }
      board.appendChild(el);
    });
    writeCode();
    hint.style.display = shapes.length ? 'none' : '';
  }

  function writeCode(){
    if(!shapes.length){
      out.innerHTML = '<span class="empty">Nothing drawn yet.</span>';
      meta.textContent = '0 shapes';
      return;
    }
    const head = `<span class="t">&lt;svg</span> <span class="a">xmlns</span>=<span class="v">"http://www.w3.org/2000/svg"</span> <span class="a">viewBox</span>=<span class="v">"0 0 ${VB_W} ${VB_H}"</span><span class="t">&gt;</span>`;
    const body = shapes.map(s => '  ' + tagHighlighted(s)).join('\n');
    out.innerHTML = head + '\n' + body + '\n' + '<span class="t">&lt;/svg&gt;</span>';
    const chars = document_svg().length;
    meta.textContent = `${shapes.length} shape${shapes.length>1?'':''} \u00b7 ${chars} chars`;
    if(shapes.length === 1) meta.textContent = `1 shape \u00b7 ${chars} chars`;
  }

  /* ---------- pointer input ---------- */

  function toSvg(evt){
    const b = board.getBoundingClientRect();
    // account for preserveAspectRatio letterboxing
    const scale = Math.min(b.width/VB_W, b.height/VB_H);
    const offX = (b.width  - VB_W*scale)/2;
    const offY = (b.height - VB_H*scale)/2;
    return {
      x: (evt.clientX - b.left - offX)/scale,
      y: (evt.clientY - b.top  - offY)/scale
    };
  }

  function baseStyle(){
    return {
      stroke: state.stroke,
      width: state.width,
      fill: state.fill
    };
  }

  board.addEventListener('pointerdown', e => {
    if(state.tool === 'erase'){
      const idx = e.target.dataset && e.target.dataset.index;
      if(idx !== undefined){
        shapes.splice(Number(idx),1);
        render();
      }
      return;
    }
    board.setPointerCapture(e.pointerId);
    drawing = true;
    const p = toSvg(e);
    pts = [p];
    const st = baseStyle();
    if(state.tool === 'pen'){
      draft = Object.assign({type:'path', d:`M ${r(p.x)} ${r(p.y)}`}, st, {fill:null});
    } else if(state.tool === 'line'){
      draft = Object.assign({type:'line', x1:p.x, y1:p.y, x2:p.x, y2:p.y}, st, {fill:null});
    } else if(state.tool === 'rect'){
      draft = Object.assign({type:'rect', x:p.x, y:p.y, w:0, h:0}, st);
    } else if(state.tool === 'ellipse'){
      draft = Object.assign({type:'ellipse', cx:p.x, cy:p.y, rx:0, ry:0}, st);
    }
    render();
  });

  board.addEventListener('pointermove', e => {
    if(!drawing || !draft) return;
    const p = toSvg(e);
    if(state.tool === 'pen'){
      const last = pts[pts.length-1];
      if(Math.hypot(p.x-last.x, p.y-last.y) < 1.2) return;
      pts.push(p);
      draft.d = polyPath(pts);           // fast raw preview
    } else {
      const a = pts[0];
      if(state.tool === 'line'){
        draft.x2 = p.x; draft.y2 = p.y;
        if(e.shiftKey){
          const dx = p.x-a.x, dy = p.y-a.y;
          if(Math.abs(dx) > Math.abs(dy)) draft.y2 = a.y; else draft.x2 = a.x;
        }
      } else if(state.tool === 'rect'){
        let w = p.x-a.x, h = p.y-a.y;
        if(e.shiftKey){ const m = Math.max(Math.abs(w),Math.abs(h));
          w = Math.sign(w||1)*m; h = Math.sign(h||1)*m; }
        draft.x = Math.min(a.x, a.x+w); draft.y = Math.min(a.y, a.y+h);
        draft.w = Math.abs(w); draft.h = Math.abs(h);
      } else if(state.tool === 'ellipse'){
        let rx = Math.abs(p.x-a.x)/2, ry = Math.abs(p.y-a.y)/2;
        if(e.shiftKey){ const m = Math.max(rx,ry); rx = ry = m; }
        draft.cx = a.x + Math.sign(p.x-a.x)*rx;
        draft.cy = a.y + Math.sign(p.y-a.y)*ry;
        draft.rx = rx; draft.ry = ry;
      }
    }
    render();
  });

  function finish(){
    if(!drawing || !draft) return;
    drawing = false;
    if(state.tool === 'pen'){
      let p = simplify(pts, state.tol);
      if(p.length < 2){
        // a tap becomes a dot
        const q = pts[0];
        draft = Object.assign({type:'ellipse', cx:q.x, cy:q.y,
          rx:state.width/2, ry:state.width/2},
          {stroke:state.stroke, width:0, fill:state.stroke});
      } else {
        const closed = isClosed(p);
        if(closed) p[p.length-1] = {x:p[0].x, y:p[0].y};
        draft.d = state.smooth ? smoothPath(p) : polyPath(p);
        if(closed) draft.d += ' Z';
        if(closed && state.fill) draft.fill = state.fill;
      }
    } else if(state.tool === 'line'){
      if(Math.hypot(draft.x2-draft.x1, draft.y2-draft.y1) < 2){ draft = null; }
    } else if(state.tool === 'rect'){
      if(draft.w < 2 || draft.h < 2) draft = null;
    } else if(state.tool === 'ellipse'){
      if(draft.rx < 2 || draft.ry < 2) draft = null;
    }
    if(draft) shapes.push(draft);
    draft = null; pts = [];
    render();
  }

  board.addEventListener('pointerup', finish);
  board.addEventListener('pointercancel', finish);
  board.addEventListener('pointerleave', e => { if(drawing) finish(); });

  /* ---------- import ---------- */

  const SUPPORTED = 'path,line,rect,ellipse,circle,polyline,polygon';

  function num(el, name, fallback){
    const v = parseFloat(el.getAttribute(name));
    return Number.isFinite(v) ? v : fallback;
  }

  // stroke / fill / width may sit on the element, an ancestor <g>, or a style attribute
  function styleOf(el){
    let stroke = null, fill = null, width = null;
    let node = el;
    while(node && node.nodeType === 1){
      const st = node.style || {};
      if(stroke === null) stroke = st.stroke || node.getAttribute('stroke');
      if(fill === null)   fill   = st.fill   || node.getAttribute('fill');
      if(width === null){
        const w = st.strokeWidth || node.getAttribute('stroke-width');
        if(w != null && w !== '') width = parseFloat(w);
      }
      node = node.parentNode;
    }
    return {
      stroke: (!stroke || stroke === 'none') ? '#16262B' : stroke,
      fill:   (!fill   || fill   === 'none') ? null : fill,
      width:  Number.isFinite(width) ? width : 1
    };
  }

  function ptsToPath(el, close){
    const raw = (el.getAttribute('points') || '').trim();
    if(!raw) return null;
    const n = raw.split(/[\s,]+/).map(parseFloat).filter(Number.isFinite);
    const p = [];
    for(let i=0;i+1<n.length;i+=2) p.push({x:n[i], y:n[i+1]});
    if(p.length < 2) return null;
    return polyPath(p) + (close ? ' Z' : '');
  }

  function scaleShape(s, k, dx, dy){
    if(k === 1 && !dx && !dy) return s;
    const f = v => v*k;
    if(s.type === 'path'){
      // scale every number pair in the path data
      let flip = 0;
      s.d = s.d.replace(/-?\d*\.?\d+(?:e[-+]?\d+)?/gi, m => {
        const v = parseFloat(m)*k + (flip++ % 2 === 0 ? dx : dy);
        return String(r(v));
      });
    } else if(s.type === 'line'){
      s.x1 = f(s.x1)+dx; s.y1 = f(s.y1)+dy; s.x2 = f(s.x2)+dx; s.y2 = f(s.y2)+dy;
    } else if(s.type === 'rect'){
      s.x = f(s.x)+dx; s.y = f(s.y)+dy; s.w = f(s.w); s.h = f(s.h);
    } else if(s.type === 'ellipse'){
      s.cx = f(s.cx)+dx; s.cy = f(s.cy)+dy; s.rx = f(s.rx); s.ry = f(s.ry);
    }
    s.width = Math.max(0, r(s.width*k));
    return s;
  }

  // Returns {shapes, errors} — never throws.
  function parseSVG(text){
    const errors = [];
    const doc = new DOMParser().parseFromString(text, 'image/svg+xml');
    if(doc.querySelector('parsererror')) return {shapes:[], errors:['That file is not valid SVG.']};
    const root = doc.querySelector('svg');
    if(!root) return {shapes:[], errors:['No <svg> element found.']};

    const found = [];
    root.querySelectorAll(SUPPORTED).forEach(el => {
      const st = styleOf(el);
      const t = el.tagName.toLowerCase();
      let s = null;
      if(t === 'path'){
        const d = el.getAttribute('d');
        if(d) s = {type:'path', d:d.trim()};
      } else if(t === 'line'){
        s = {type:'line', x1:num(el,'x1',0), y1:num(el,'y1',0), x2:num(el,'x2',0), y2:num(el,'y2',0)};
      } else if(t === 'rect'){
        s = {type:'rect', x:num(el,'x',0), y:num(el,'y',0), w:num(el,'width',0), h:num(el,'height',0)};
      } else if(t === 'ellipse'){
        s = {type:'ellipse', cx:num(el,'cx',0), cy:num(el,'cy',0), rx:num(el,'rx',0), ry:num(el,'ry',0)};
      } else if(t === 'circle'){
        const rad = num(el,'r',0);
        s = {type:'ellipse', cx:num(el,'cx',0), cy:num(el,'cy',0), rx:rad, ry:rad};
      } else if(t === 'polyline' || t === 'polygon'){
        const d = ptsToPath(el, t === 'polygon');
        if(d) s = {type:'path', d};
      }
      if(!s) return;
      s.stroke = st.stroke; s.fill = st.fill; s.width = st.width;
      found.push(s);
    });

    if(!found.length) errors.push('No drawable shapes found. Supported: path, line, rect, ellipse, circle, polyline, polygon.');

    // fit an incoming viewBox onto our canvas
    const vb = (root.getAttribute('viewBox') || '').split(/[\s,]+/).map(parseFloat);
    if(vb.length === 4 && vb.every(Number.isFinite) && vb[2] > 0 && vb[3] > 0){
      const k = Math.min(VB_W/vb[2], VB_H/vb[3]);
      const dx = (VB_W - vb[2]*k)/2 - vb[0]*k;
      const dy = (VB_H - vb[3]*k)/2 - vb[1]*k;
      found.forEach(s => scaleShape(s, k, dx, dy));
    }
    if(root.querySelector('text,image,use,g[transform],[transform]')){
      errors.push('Transforms, text and images were skipped.');
    }
    return {shapes:found, errors};
  }

  function load(text, replace){
    const {shapes:got, errors} = parseSVG(text);
    if(got.length){
      shapes = replace ? got : shapes.concat(got);
      render();
    }
    if(errors.length) notify(errors.join(' '));
    else if(got.length) notify(`Imported ${got.length} shape${got.length>1?'s':''}.`);
    return got.length;
  }

  let notifyTimer;
  function notify(msg){
    hint.textContent = msg;
    hint.style.display = '';
    clearTimeout(notifyTimer);
    notifyTimer = setTimeout(() => {
      hint.textContent = 'Drag to draw \u00b7 Cmd/Ctrl+Z to undo';
      hint.style.display = shapes.length ? 'none' : '';
    }, 4000);
  }

  const fileInput = document.getElementById('file');
  document.getElementById('import').addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', () => {
    const f = fileInput.files && fileInput.files[0];
    if(!f) return;
    const reader = new FileReader();
    reader.onload = () => load(String(reader.result), true);
    reader.onerror = () => notify('That file could not be read.');
    reader.readAsText(f);
    fileInput.value = '';
  });

  // drag a .svg file straight onto the canvas
  ['dragover','drop'].forEach(t => board.addEventListener(t, e => e.preventDefault()));
  board.addEventListener('drop', e => {
    const f = e.dataTransfer && e.dataTransfer.files[0];
    if(!f) return;
    const reader = new FileReader();
    reader.onload = () => load(String(reader.result), true);
    reader.readAsText(f);
  });

  /* ---------- ?svg= in the URL ---------- */

  function fromQuery(){
    const q = new URLSearchParams(location.search).get('svg');
    if(!q) return;
    let text = q;
    // tolerate raw, percent-encoded, and base64 payloads
    if(!/<\s*svg/i.test(text)){
      try{ const d = decodeURIComponent(text); if(/<\s*svg/i.test(d)) text = d; }catch(err){}
    }
    if(!/<\s*svg/i.test(text)){
      try{ const d = atob(text.replace(/-/g,'+').replace(/_/g,'/')); if(/<\s*svg/i.test(d)) text = d; }catch(err){}
    }
    if(!/<\s*svg/i.test(text)){ notify('The ?svg= value does not contain SVG markup.'); return; }
    load(text, true);
  }

  document.getElementById('link').addEventListener('click', async () => {
    const btn = document.getElementById('link');
    if(!shapes.length){ notify('Draw something first.'); return; }
    const url = location.origin + location.pathname + '?svg=' + encodeURIComponent(document_svg());
    try{ await navigator.clipboard.writeText(url); }catch(err){}
    btn.textContent = url.length > 8000 ? 'Copied (long)' : 'Copied';
    setTimeout(()=> btn.textContent = 'Copy link', 1400);
  });

  /* ---------- controls ---------- */

  document.getElementById('tools').addEventListener('click', e => {
    const b = e.target.closest('button[data-tool]');
    if(!b) return;
    state.tool = b.dataset.tool;
    [...e.currentTarget.querySelectorAll('button')]
      .forEach(x => x.setAttribute('aria-pressed', String(x === b)));
    board.style.cursor = state.tool === 'erase' ? 'default' : 'crosshair';
    render();
  });

  document.getElementById('stroke').addEventListener('input', e => state.stroke = e.target.value);

  const fillInput = document.getElementById('fill');
  const fillOn = document.getElementById('fillOn');
  function syncFill(){
    fillInput.disabled = !fillOn.checked;
    state.fill = fillOn.checked ? fillInput.value : null;
  }
  fillOn.addEventListener('change', syncFill);
  fillInput.addEventListener('input', syncFill);

  const widthEl = document.getElementById('width');
  widthEl.addEventListener('input', e => {
    state.width = Number(e.target.value);
    document.getElementById('widthVal').textContent = state.width;
  });

  const tolEl = document.getElementById('tol');
  tolEl.addEventListener('input', e => {
    state.tol = Number(e.target.value);
    document.getElementById('tolVal').textContent = state.tol;
  });

  const smoothBtn = document.getElementById('smooth');
  smoothBtn.addEventListener('click', () => {
    state.smooth = !state.smooth;
    smoothBtn.setAttribute('aria-pressed', String(state.smooth));
  });

  document.getElementById('undo').addEventListener('click', () => {
    shapes.pop(); render();
  });
  document.getElementById('clear').addEventListener('click', () => {
    shapes = []; render();
  });

  document.addEventListener('keydown', e => {
    if((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'z'){
      e.preventDefault(); shapes.pop(); render();
    }
  });

  const copyBtn = document.getElementById('copy');
  copyBtn.addEventListener('click', async () => {
    const text = document_svg();
    try{
      await navigator.clipboard.writeText(text);
      copyBtn.textContent = 'Copied';
    }catch(err){
      const ta = document.createElement('textarea');
      ta.value = text; document.body.appendChild(ta);
      ta.select(); document.execCommand('copy'); ta.remove();
      copyBtn.textContent = 'Copied';
    }
    setTimeout(()=> copyBtn.textContent = 'Copy', 1200);
  });

  document.getElementById('download').addEventListener('click', () => {
    const blob = new Blob([document_svg()], {type:'image/svg+xml'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'drawing.svg';
    a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
  });

  syncFill();
  render();
  fromQuery();
})();
</script>
</body>
</html>
